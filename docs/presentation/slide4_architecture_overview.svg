<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 46px Segoe UI,Arial,sans-serif;fill:#0f172a}
      .label{font:600 22px Segoe UI,Arial,sans-serif;fill:#0f172a}
      .small{font:500 18px Segoe UI,Arial,sans-serif;fill:#334155}
      .box{stroke:#94a3b8;stroke-width:2}
      .arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="90" class="title">Slide 4: Architecture Overview</text>

  <rect x="70" y="180" rx="20" ry="20" width="280" height="90" class="box" fill="#dbeafe"/>
  <text x="210" y="235" text-anchor="middle" class="label">Frontend UI</text>

  <rect x="430" y="180" rx="20" ry="20" width="320" height="90" class="box" fill="#c7d2fe"/>
  <text x="590" y="235" text-anchor="middle" class="label">FastAPI Backend</text>

  <rect x="920" y="120" rx="20" ry="20" width="360" height="100" class="box" fill="#dcfce7"/>
  <text x="1100" y="180" text-anchor="middle" class="label">Script Analyzer Service</text>

  <rect x="920" y="270" rx="20" ry="20" width="360" height="100" class="box" fill="#fde68a"/>
  <text x="1100" y="330" text-anchor="middle" class="label">Video Pipeline Service</text>

  <rect x="1320" y="120" rx="20" ry="20" width="230" height="100" class="box" fill="#fecaca"/>
  <text x="1435" y="180" text-anchor="middle" class="label">Report Generator</text>

  <rect x="1320" y="270" rx="20" ry="20" width="230" height="100" class="box" fill="#fed7aa"/>
  <text x="1435" y="330" text-anchor="middle" class="label">Recommendation</text>
  <text x="1435" y="357" text-anchor="middle" class="label">Engine</text>

  <rect x="430" y="600" rx="20" ry="20" width="480" height="120" class="box" fill="#e2e8f0"/>
  <text x="670" y="665" text-anchor="middle" class="label">SQLite + SQLAlchemy</text>
  <text x="670" y="695" text-anchor="middle" class="small">Metadata, analysis logs, recommendations</text>

  <path d="M350 225 L430 225" class="arrow"/>

  <path d="M750 205 L920 170" class="arrow"/>
  <path d="M750 245 L920 320" class="arrow"/>

  <path d="M1280 170 L1320 170" class="arrow"/>
  <path d="M1280 320 L1320 320" class="arrow"/>

  <path d="M1100 220 L1100 585 L910 660" class="arrow"/>
  <path d="M1100 370 L1100 610 L910 680" class="arrow"/>
  <path d="M1435 220 L1435 640 L910 640" class="arrow"/>
  <path d="M1435 370 L1435 700 L910 700" class="arrow"/>
</svg>
